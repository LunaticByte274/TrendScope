services:
  - type: web
    name: trendscope-platform
    env: python
    plan: free
    buildCommand: |
      npm --prefix frontend install
      npm --prefix frontend run build
      pip install -r backend/requirements.txt
    startCommand: cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0

